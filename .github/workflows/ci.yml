name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Velcro hook and setup tests
        run: npm test
      - name: Setup TUI plain fallback (no gum)
        run: bash bin/prefontaine-setup --defaults --dry-run --no-gum
      - name: Validate plugin and marketplace manifests
        run: |
          npx --yes @anthropic-ai/claude-code plugin validate .claude-plugin/plugin.json --strict
          npx --yes @anthropic-ai/claude-code plugin validate .claude-plugin/marketplace.json --strict
